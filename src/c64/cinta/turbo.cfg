# the turbo core (turbo.s): its entries and the code run at every bit in the cassette buffer ($033C-$03FB, padded to
# its 192 bytes in the file), then what runs once a block at $02B0-$02FF (unused by the KERNAL)
MEMORY {
    CASETE: start = $033C, size = $00C0, type = rw, file = %O, fill = yes;
    PAGINA2: start = $02B0, size = $0050, type = rw, file = %O;
}
SEGMENTS {
    TURBO: load = CASETE, type = rw;
    TURBO2: load = PAGINA2, type = rw;
}
