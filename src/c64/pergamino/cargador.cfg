# The game's loader (cargador.s): one binary that runs from $C3E8 (the screen RAM's unused tail and the tiles' merge
# tables: free during the load, c64/cinta/libres.py); carga.s includes it in the first stage and copies it there.
# It must end before $C700 (PAGINA3, the game's page 3 held aside).
MEMORY {
    RAM: start = $C3E8, size = $C700 - $C3E8, type = rw, file = %O;
}
SEGMENTS {
    CODE:   load = RAM, type = ro;
    RODATA: load = RAM, type = ro;
}
