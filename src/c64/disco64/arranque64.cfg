# abadia64ks, the C64 disk's KERNAL programs (arranque64.s): a PRG at $0801
MEMORY {
    CARGA: start = $07FF, size = $0002, file = %O;
    BASIC: start = $0801, size = $2000, type = rw, file = %O;
}
SEGMENTS {
    LOADADDR: load = CARGA, type = ro;
    CODE: load = BASIC, type = rw;
}
