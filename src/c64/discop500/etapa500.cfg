# abadia128ks on the P500: the last stage of the loading, at $0200 of bank 1 (c64/discop500/etapa500.s), a plain binary
MEMORY {
    ZP:   start = $00A7, size = $0059, type = rw;
    RAM:  start = $0200, size = $0E00, type = rw, file = %O;
}
SEGMENTS {
    CODE:     load = RAM, type = rw;
    RODATA:   load = RAM, type = ro;
    DATA:     load = RAM, type = rw, optional = yes;
    BSS:      load = RAM, type = bss, optional = yes;
    ZEROPAGE: load = ZP, type = zp, optional = yes;
}
