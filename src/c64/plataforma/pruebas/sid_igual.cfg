# a player alone at $1000 for sid_igual.c (its zero page, if any, at $80: not in the file)
MEMORY { ZP: start = $80, size = $40, type = rw, file = ""; RAM: start = $1000, size = $C000, file = %O; }
SEGMENTS { ZEROPAGE: load = ZP, type = zp, optional = yes; CODE: load = RAM, type = ro; BAJO: load = RAM, type = ro, optional = yes; RODATA: load = RAM, type = ro;
           DATA: load = RAM, type = rw, optional = yes; BSS: load = RAM, type = bss, optional = yes; }
