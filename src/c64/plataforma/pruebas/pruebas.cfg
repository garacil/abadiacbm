# ld65 configuration of the platform's test programs: a PRG loaded at $0801 (BASIC line SYS 2061), code and
# data up to $BFFF; the tests place what they need above it at run time.
MEMORY {
    ZP:       start = $0002, size = $00FE, type = rw;
    LOADADDR: start = $07FF, size = $0002, file = %O;
    MAIN:     start = $0801, size = $B7FF, file = %O;
}
SEGMENTS {
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = MAIN, type = ro;
    CODE:     load = MAIN, type = rw;
    BAJO:     load = MAIN, type = rw, optional = yes;
    RODATA:   load = MAIN, type = ro, optional = yes;
    DATA:     load = MAIN, type = rw, optional = yes;
    BSS:      load = MAIN, type = bss, optional = yes, define = yes;
    ZEROPAGE: load = ZP, type = zp, optional = yes;
}
