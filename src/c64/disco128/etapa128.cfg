# abadia128ks: the last stage of the game's loading (etapa128.s with Exomizer's exodecrunch.s) at $C000-$C3E7, the
# game's screen RAM (c64/disco128/NOTAS.md); a raw binary, included by c64/presentacion/carga128.s
MEMORY {
    ETAPA: start = $C000, size = $03E8, type = rw, file = %O;
}
SEGMENTS {
    CODE: load = ETAPA, type = rw;
    RODATA: load = ETAPA, type = ro;
    BSS: load = ETAPA, type = bss, define = yes;
}
