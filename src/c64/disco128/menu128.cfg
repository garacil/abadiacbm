# abadia128ks: the menu (c64/cinta/menu.s -D C128, with exo_mem.s and exodecrunch.s), a program at $1300 loaded by
# the boot sector, in $1300-$1AFF ($1300-$1BFF is free for programs on the C128, "Mapping the Commodore 128"; the
# crunched presentation may start at $1B00, construye.sh checks)
MEMORY {
    CARGA: start = $12FE, size = $0002, file = %O;
    MENU:  start = $1300, size = $0800, type = rw, file = %O;
}
SEGMENTS {
    DIRECCION: load = CARGA, type = ro;
    CODE: load = MENU, type = rw;
    RODATA: load = MENU, type = ro;
    BSS: load = MENU, type = bss, define = yes;
}
